<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC/USDT Candlestick Chart</title>
    <style>
        body {
            background-color: #2b2b2b;
            font-family: monospace;
            margin: 0;
            padding: 0;
        }
        #chart-container {
            width: 100%;
            height: 600px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        const BTC_DATA = [{"date": "2026-04-03", "open": 66901.99, "high": 67370.42, "low": 66282.0, "close": 66964.3, "volume": 11429.13131}, {"date": "2026-04-04", "open": 66964.29, "high": 67562.93, "low": 66775.91, "close": 67300.42, "volume": 7373.51613}, {"date": "2026-04-05", "open": 67300.42, "high": 69136.2, "low": 66611.66, "close": 69034.18, "volume": 11733.46752}, {"date": "2026-04-06", "open": 69034.18, "high": 70351.46, "low": 68300.0, "close": 68853.66, "volume": 20281.61044}, {"date": "2026-04-07", "open": 68853.66, "high": 72761.0, "low": 67732.01, "close": 71924.22, "volume": 23750.49661}, {"date": "2026-04-08", "open": 71924.22, "high": 72857.0, "low": 70707.23, "close": 71069.93, "volume": 19802.68627}, {"date": "2026-04-09", "open": 71069.93, "high": 73145.0, "low": 70466.0, "close": 71787.97, "volume": 18158.42159}, {"date": "2026-04-10", "open": 71787.98, "high": 73434.0, "low": 71426.15, "close": 72962.7, "volume": 17372.63288}, {"date": "2026-04-11", "open": 72962.71, "high": 73790.0, "low": 72513.09, "close": 73043.16, "volume": 9070.94374}, {"date": "2026-04-12", "open": 73043.16, "high": 73137.24, "low": 70505.88, "close": 70740.98, "volume": 13472.46801}, {"date": "2026-04-13", "open": 70741.56, "high": 74900.0, "low": 70566.99, "close": 74417.99, "volume": 24230.21625}, {"date": "2026-04-14", "open": 74418.0, "high": 76038.0, "low": 73795.47, "close": 74131.55, "volume": 26532.94456}, {"date": "2026-04-15", "open": 74131.55, "high": 75425.0, "low": 73514.0, "close": 74809.99, "volume": 14425.04167}, {"date": "2026-04-16", "open": 74809.99, "high": 75534.76, "low": 73309.85, "close": 75154.29, "volume": 17088.68777}, {"date": "2026-04-17", "open": 75154.28, "high": 78333.0, "low": 74529.4, "close": 77072.0, "volume": 25941.36694}, {"date": "2026-04-18", "open": 77072.01, "high": 77420.08, "low": 75445.16, "close": 75691.76, "volume": 9141.84456}, {"date": "2026-04-19", "open": 75691.76, "high": 76240.66, "low": 73762.9, "close": 73801.79, "volume": 11369.82232}, {"date": "2026-04-20", "open": 73801.8, "high": 76558.62, "low": 73724.31, "close": 75840.97, "volume": 16993.41034}, {"date": "2026-04-21", "open": 75840.97, "high": 76927.57, "low": 74821.57, "close": 76336.15, "volume": 14912.57132}, {"date": "2026-04-22", "open": 76336.14, "high": 79472.82, "low": 76132.95, "close": 78178.23, "volume": 19737.51225}, {"date": "2026-04-23", "open": 78178.22, "high": 78662.5, "low": 76960.0, "close": 78257.48, "volume": 16970.79501}, {"date": "2026-04-24", "open": 78257.48, "high": 78581.93, "low": 77264.08, "close": 77437.13, "volume": 12675.14315}, {"date": "2026-04-25", "open": 77437.13, "high": 77885.35, "low": 77140.23, "close": 77625.0, "volume": 5685.1142}, {"date": "2026-04-26", "open": 77625.0, "high": 78961.0, "low": 77326.51, "close": 78657.55, "volume": 7963.56162}, {"date": "2026-04-27", "open": 78657.55, "high": 79485.66, "low": 76459.64, "close": 77371.32, "volume": 16046.92418}, {"date": "2026-04-28", "open": 77371.32, "high": 77478.0, "low": 75666.6, "close": 76342.77, "volume": 13210.72383}, {"date": "2026-04-29", "open": 76342.78, "high": 77904.93, "low": 74937.52, "close": 75780.0, "volume": 18279.93022}, {"date": "2026-04-30", "open": 75780.0, "high": 76669.14, "low": 75323.65, "close": 76346.57, "volume": 10381.81607}, {"date": "2026-05-01", "open": 76346.58, "high": 78914.12, "low": 76320.42, "close": 78231.13, "volume": 17315.46502}, {"date": "2026-05-02", "open": 78231.13, "high": 79199.48, "low": 78040.0, "close": 78664.66, "volume": 6123.6215}];

        const chartContainer = document.getElementById('chart-container');
        const chartWidth = chartContainer.offsetWidth;
        const chartHeight = chartContainer.offsetHeight;
        const padding = 20;

        const canvas = document.createElement('canvas');
        canvas.width = chartWidth;
        canvas.height = chartHeight;
        chartContainer.appendChild(canvas);

        const ctx = canvas.getContext('2d');

        let minX = 0;
        let maxX = BTC_DATA.length - 1;
        let minY = Math.min(...BTC_DATA.map(d => d.low)) * 0.9;
        let maxY = Math.max(...BTC_DATA.map(d => d.high)) * 1.1;

        function drawChart() {
            ctx.clearRect(0, 0, chartWidth, chartHeight);

            // Draw background
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, chartWidth, chartHeight);

            // Draw grid
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 1;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(0, chartHeight - (i * (chartHeight / 10)));
                ctx.lineTo(chartWidth, chartHeight - (i * (chartHeight / 10)));
                ctx.stroke();
            }

            // Draw candles
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            for (let i = minX; i <= maxX; i++) {
                const candle = BTC_DATA[i];
                const x = (i - minX) / (maxX - minX) * (chartWidth - 2 * padding) + padding;
                const o = (candle.open - minY) / (maxY - minY) * (chartHeight - 2 * padding) + padding;
                const h = (candle.high - minY) / (maxY - minY) * (chartHeight - 2 * padding) + padding;
                const l = (candle.low - minY) / (maxY - minY) * (chartHeight - 2 * padding) + padding;
                const c = (candle.close - minY) / (maxY - minY) * (chartHeight - 2 * padding) + padding;

                ctx.beginPath();
                ctx.moveTo(x, h);
                ctx.lineTo(x, l);
                ctx.stroke();

                if (candle.close > candle.open) {
                    ctx.fillStyle = '#green';
                } else {
                    ctx.fillStyle = '#red';
                }
                ctx.fillRect(x - 2, o, 4, c - o);
            }

            // Draw SMA-7 and SMA-21
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 2;
            let sum7 = 0;
            let sum21 = 0;
            for (let i = maxX; i >= minX; i--) {
                sum7 += BTC_DATA[i].close;
                sum21 += BTC_DATA[i].close;
                if (i < maxX - 7) sum7 -= BTC_DATA[i + 7].close;
                if (i < maxX - 21) sum21 -= BTC_DATA[i + 21].close;

                const x = (i - minX) / (maxX - minX) * (chartWidth - 2 * padding) + padding;
                const sma7 = sum7 / Math.min(7, i + 1);
                const sma21 = sum21 / Math.min(21, i + 1);
                const y7 = (sma7 - minY) / (maxY - minY) * (chartHeight - 2 * padding) + padding;
                const y21 = (sma21 - minY) / (maxY - minY) * (chartHeight - 2 * padding) + padding;

                if (i === maxX) {
                    ctx.beginPath();
                    ctx.moveTo(x, y7);
                } else {
                    ctx.lineTo(x, y7);
                }
            }
            ctx.stroke();

            ctx.strokeStyle = '#00f';
            ctx.beginPath();
            for (let i = maxX; i >= minX; i--) {
                const x = (i - minX) / (maxX - minX) * (chartWidth - 2 * padding) + padding;
                const sum = 0;
                for (let j = 0; j <= i; j++) {
                    sum += BTC_DATA[j].close;
                }
                const sma = sum / (i + 1);
                const y = (sma - minY) / (maxY - minY) * (chartHeight - 2 * padding) + padding;

                if (i === maxX) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            // Draw volume
            ctx.fillStyle = '#fff';
            for (let i = minX; i <= maxX; i++) {
                const volume = BTC_DATA[i].volume;
                const x = (i - minX) / (maxX - minX) * (chartWidth - 2 * padding) + padding;
                const y = chartHeight - padding - (volume / Math.max(...BTC_DATA.map(d => d.volume))) * (chartHeight / 2);
                ctx.fillRect(x - 1, y, 2, chartHeight - y);
            }
        }

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;

        canvas.addEventListener('wheel', (e) => {
            if (e.deltaY > 0) {
                maxX = Math.min(maxX + 1, BTC_DATA.length - 1);
                minX = Math.max(minX + 1, 0);
            } else {
                maxX = Math.max(maxX - 1, 0);
                minX = Math.min(minX - 1, maxX);
            }
            drawChart();
        });

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - dragStartX;
                const newMinX = minX - dx / (chartWidth - 2 * padding) * (maxX - minX);
                const newMaxX = maxX - dx / (chartWidth - 2 * padding) * (maxX - minX);
                minX = Math.max(newMinX, 0);
                maxX = Math.min(newMaxX, BTC_DATA.length - 1);
                dragStartX = e.clientX;
                drawChart();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseover', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left - padding) / (chartWidth - 2 * padding) * (maxX - minX) + minX;
            const idx = Math.round(x);
            if (idx >= 0 && idx < BTC_DATA.length) {
                const candle = BTC_DATA[idx];
                ctx.font = '12px monospace';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`Date: ${candle.date}`, 10, 10);
                ctx.fillText(`O: ${candle.open.toFixed(2)}`, 10, 24);
                ctx.fillText(`H: ${candle.high.toFixed(2)}`, 10, 38);
                ctx.fillText(`L: ${candle.low.toFixed(2)}`, 10, 52);
                ctx.fillText(`C: ${candle.close.toFixed(2)}`, 10, 66);
                ctx.fillText(`Volume: ${candle.volume.toFixed(2)}`, 10, 80);
            }
        });

        drawChart();
    </script>
</body>
</html>
