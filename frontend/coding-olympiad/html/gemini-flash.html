        /* Basic CSS Reset & Dark Theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; /* Dark background */
            color: #e0e0e0; /* Light text */
            overflow: hidden; /* Prevent body scroll */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensure body takes full viewport height */
        }

        #chart-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background-color: #0d0d0d; /* Even darker for chart background */
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            /* Max width/height for responsiveness, actual size set by JS */
            max-width: 98%;
            max-height: 98%;
            cursor: grab; /* Default cursor for panning */
        }
    </style>
</head>

        // Global variables for chart state
        let canvas, ctx;
        let chartData = []; // Processed data with SMA
        let visibleStartIndex = 0;
        let visibleEndIndex;
        let chartWidth, chartHeight;
        let mainChartHeightRatio = 0.75; // Main chart takes 75% height, volume 25%
        let margin = { top: 30, right: 80, bottom: 30, left: 50 }; // Margins for axes/labels

        // Interaction state
        let isDragging = false;

            visible: false,

        // Chart rendering parameters (calculated in renderChart)
        let minPrice, maxPrice, priceRange;

        /**
         * Calculates the Simple Moving Average (SMA) for a given period.
         * @param {Array<Object>} data - The input data array.
         * @param {number} period - The period for the SMA calculation.
         * @returns {Array<number|null>} An array of SMA values, with null for initial points.
         */
        function calculateSMA(data, period) {
            const sma = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    sma.push(null); // Not enough data for SMA
                } else {
                    let sum = 0;
                    for (let j = 0; j < period; j++) {
                        sum += data[i - j].close;
                    }
                    sma.push(sum / period);
                }
            }
            return sma;
        }

        /**
         * Processes the raw BTC_DATA, converts dates, and calculates SMAs.
         */
        function processData() {
            chartData = BTC_DATA.map(d => ({
                date: new Date(d.date),
                open: d.open,
                high: d.high,
                low: d.low,
                close: d.close,
                volume: d.volume,
                sma7: null, // Placeholder
                sma21: null // Placeholder
            }));

            const sma7 = calculateSMA(chartData, 7);
            const sma21 = calculateSMA(chartData, 21);

            chartData.forEach((d, i) => {
                d.sma7 = sma7[i];
                d.sma21 = sma21[i];
            });

            visibleEndIndex = chartData.length - 1; // Initially show all data
        }

        // --- Formatting Helpers ---
        function formatDate(date) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function formatPrice(price) {
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatVolume(volume) {
            if (volume >= 1000000) return (volume / 1000000).toFixed(2) + 'M';
            if (volume >= 1000) return (volume / 1000).toFixed(2) + 'K';
            return volume.toFixed(0);
        }

        /**
         * Finds the min/max OHLC (high and low) values within a specified data range.
         * @param {Array<Object>} data - The chart data.
         * @param {number} startIndex - The starting index of the range.
         * @param {number} endIndex - The ending index of the range.
         * @returns {{min: number, max: number}} The minimum and maximum OHLC values.
         */
        function getMinMaxOHLC(data, startIndex, endIndex) {
            let min = Infinity;
            let max = -Infinity;
            for (let i = startIndex; i <= endIndex; i++) {
                if (data[i]) {
                    min = Math.min(min, data[i].low);
                    max = Math.max(max, data[i].high);
                }
            }
            return { min, max };
        }

        /**
         * Finds the min/max value for a specific key within a specified data range.
         * @param {Array<Object>} data - The chart data.
         * @param {string} key - The key to check (e.g., 'volume').
         * @param {number} startIndex - The starting index of the range.
         * @param {number} endIndex - The ending index of the range.
         * @returns {{min: number, max: number}} The minimum and maximum values for the key.
         */
        function getMinMax(data, key, startIndex, endIndex) {
            let min = Infinity;
            let max = -Infinity;
            for (let i = startIndex; i <= endIndex; i++) {
                if (data[i] && data[i][key] !== null) {
                    min = Math.min(min, data[i][key]);
                    max = Math.max(max, data[i][key]);
                }
            }
            return { min, max };
        }

        // --- Drawing Functions ---

        /**
         * Draws a single candlestick.
         * @param {CanvasRenderingContext2D} ctx - The 2D rendering context.
         * @param {number} x - The X-coordinate for the center of the candlestick.
         * @param {number} open - The open price.
         * @param {number} high - The high price.
         * @param {number} low - The low price.
         * @param {number} close - The close price.
         * @param {number} candleWidth - The width of the candlestick body.
         * @param {number} scaleY - The Y-axis scale (pixels per price unit).
         * @param {number} chartY - The Y-coordinate of the top of the main chart area.
         * @param {number} chartMaxPrice - The maximum price value displayed on the chart.
         */
        function drawCandlestick(ctx, x, open, high, low, close, candleWidth, scaleY, chartY, chartMaxPrice) {
            const isBullish = close >= open;
            ctx.fillStyle = isBullish ? '#00c853' : '#d50000'; // Green for bullish, Red for bearish
            ctx.strokeStyle = ctx.fillStyle;

            // Calculate Y positions relative to chartY (top of the main chart area)
            const bodyTop = chartY + (chartMaxPrice - (isBullish ? close : open)) * scaleY;
            const bodyBottom = chartY + (chartMaxPrice - (isBullish ? open : close)) * scaleY;
            const wickTop = chartY + (chartMaxPrice - high) * scaleY;
            const wickBottom = chartY + (chartMaxPrice - low) * scaleY;

            // Draw wick
            ctx.beginPath();
            ctx.moveTo(x, wickTop);
            ctx.lineTo(x, wickBottom);
            ctx.stroke();

            // Draw body
            ctx.fillRect(x - candleWidth / 2, bodyTop, candleWidth, Math.max(1, bodyBottom - bodyTop)); // Math.max(1, ...) for thin candles
        }

        /**
         * Draws a single volume bar.
         * @param {CanvasRenderingContext2D} ctx - The 2D rendering context.
         * @param {number} x - The X-coordinate for the center of the volume bar.
         * @param {number} volume - The volume value.
         * @param {number} candleWidth - The width of the volume bar.
         * @param {number} scaleY - The Y-axis scale (pixels per volume unit).
         * @param {number} chartBottomY - The Y-coordinate of the bottom of the volume chart area.
         * @param {boolean} isBullish - True if the corresponding candlestick is bullish, false otherwise.
         */
        function drawVolumeBar(ctx, x, volume, candleWidth, scaleY, chartBottomY, isBullish) {
            ctx.fillStyle = isBullish ? '#00c85380' : '#d5000080'; // Lighter green/red for volume
            const barHeight = volume * scaleY;
            ctx.fillRect(x - candleWidth / 2, chartBottomY - barHeight, candleWidth, barHeight);
        }

        /**
         * Draws a Simple Moving Average (SMA) line.
         * @param {CanvasRenderingContext2D} ctx - The 2D rendering context.
         * @param {Array<Object>} data - The chart data.
         * @param {string} smaKey - The key for the SMA value (e.g., 'sma7').
         * @param {string} color - The color of the SMA line.
         * @param {number} scaleX - The X-axis scale (pixels per data point).
         * @param {number} scaleY - The Y-axis scale (pixels per price unit).
         * @param {number} chartX - The X-coordinate of the left of the main chart area.
         * @param {number} chartY - The Y-coordinate of the top of the main chart area.
         * @param {number} chartMaxPrice - The maximum price value displayed on the chart.
         */
        function drawSMA(ctx, data, smaKey, color, scaleX, scaleY, chartX, chartY, chartMaxPrice) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();

            let firstPoint = true;
            for (let i = visibleStartIndex; i <= visibleEndIndex; i++) {
                const d = data[i];
                if (d && d[smaKey] !== null) {
                    const x = chartX + (i - visibleStartIndex) * scaleX + scaleX / 2; // Center SMA on candle
                    const y = chartY + (chartMaxPrice - d[smaKey]) * scaleY;
                    if (firstPoint) {
                        ctx.moveTo(x, y);
                        firstPoint = false;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
            }
            ctx.stroke();
        }

        /**
         * Draws the grid lines for the main and volume charts.
         * @param {CanvasRenderingContext2D} ctx - The 2D rendering context.
         * @param {Object} mainRect - Dimensions of the main chart area.
         * @param {Object} volumeRect - Dimensions of the volume chart area.
         * @param {number} minP - Minimum price in view.
         * @param {number} maxP - Maximum price in view.
         * @param {number} minV - Minimum volume in view.
         * @param {number} maxV - Maximum volume in view.
         */
        function drawGrid(ctx, mainRect, volumeRect, minP, maxP, minV, maxV) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 0.5;
            ctx.font = '10px Arial';
            ctx.fillStyle = '#888';

            // Horizontal grid lines for main chart
            const priceStep = priceRange / 5; // 5 horizontal lines
            for (let i = 0; i <= 5; i++) {
                const price = minP + priceStep * i;
                const y = mainRect.y + (maxP - price) * priceScaleY;
                ctx.beginPath();
                ctx.moveTo(mainRect.x, y);
                ctx.lineTo(mainRect.x + mainRect.width, y);
                ctx.stroke();
            }

            // Horizontal grid lines for volume chart
            const volumeStep = volumeRange / 2; // 2 horizontal lines
            for (let i = 0; i <= 2; i++) {
                const volume = minV + volumeStep * i;
                const y = volumeRect.y + (maxV - volume) * volumeScaleY;
                ctx.beginPath();
                ctx.moveTo(volumeRect.x, y);
                ctx.lineTo(volumeRect.x + volumeRect.width, y);
                ctx.stroke();
            }

            // Vertical grid lines (dates)
            const visibleCandleCount = visibleEndIndex - visibleStartIndex + 1;
            const numVerticalLines = Math.min(visibleCandleCount, 10); // Max 10 lines
            const step = Math.max(1, Math.floor(visibleCandleCount / numVerticalLines));
            for (let i = 0; i < visibleCandleCount; i += step) {
                const x = mainRect.x + i * candleSpacing + candleSpacing / 2;
                ctx.beginPath();
                ctx.moveTo(x, mainRect.y);
                ctx.lineTo(x, mainRect.y + mainRect.height);
                ctx.moveTo(x, volumeRect.y);
                ctx.lineTo(x, volumeRect.y + volumeRect.height);
                ctx.stroke();
            }
        }

        /**
         * Draws the axes labels for price, volume, and dates.
         * @param {CanvasRenderingContext2D} ctx - The 2D rendering context.
         * @param {number} minP - Minimum price in view.
         * @param {number} maxP - Maximum price in view.
         * @param {number} minV - Minimum volume in view.
         * @param {number} maxV - Maximum volume in view.
         * @param {Object} mainRect - Dimensions of the main chart area.
         * @param {Object} volumeRect - Dimensions of the volume chart area.
         * @param {number} candleSpacing - The spacing allocated for each candle.
         * @param {Array<Object>} visibleData - The currently visible data points.
         */
        function drawAxes(ctx, minP, maxP, minV, maxV, mainRect, volumeRect, candleSpacing, visibleData) {
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.font = '10px Arial';
            ctx.fillStyle = '#e0e0e0';

            // Main Chart Y-axis (Price)
            ctx.beginPath();
            ctx.moveTo(mainRect.x + mainRect.width, mainRect.y);
            ctx.lineTo(mainRect.x + mainRect.width, mainRect.y + mainRect.height);
            ctx.stroke();

            const priceStep = priceRange / 5;
            for (let i = 0; i <= 5; i++) {
                const price = minP + priceStep * i;
                const y = mainRect.y + (maxP - price) * priceScaleY;
                ctx.fillText(formatPrice(price), mainRect.x + mainRect.width + 5, y + 3);
            }

            // Volume Chart Y-axis (Volume)
            ctx.beginPath();
            ctx.moveTo(volumeRect.x + volumeRect.width, volumeRect.y);
            ctx.lineTo(volumeRect.x + volumeRect.width, volumeRect.y + volumeRect.height);
            ctx.stroke();

            const volumeStep = volumeRange / 2;
            for (let i = 0; i <= 2; i++) {
                const volume = minV + volumeStep * i;
                const y = volumeRect.y + (maxV - volume) * volumeScaleY;
                ctx.fillText(formatVolume(volume), volumeRect.x + volumeRect.width + 5, y + 3);
            }

            // X-axis (Dates)
            ctx.beginPath();
            ctx.moveTo(mainRect.x, mainRect.y + mainRect.height);
            ctx.lineTo(mainRect.x + mainRect.width, mainRect.y + mainRect.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(volumeRect.x, volumeRect.y + volumeRect.height);
            ctx.lineTo(volumeRect.x + volumeRect.width, volumeRect.y + volumeRect.height);
            ctx.stroke();

            const numDateLabels = Math.min(visibleData.length, 5); // Max 5 date labels
            const dateStep = Math.max(1, Math.floor(visibleData.length / numDateLabels));
            for (let i = 0; i < visibleData.length; i += dateStep) {
                const dataPoint = visibleData[i];
                const x = mainRect.x + i * candleSpacing + candleSpacing / 2;
                ctx.fillText(formatDate(dataPoint.date), x - 30, volumeRect.y + volumeRect.height + 15);
            }
        }

        /**
         * Draws the tooltip on hover.
         * @param {CanvasRenderingContext2D} ctx - The 2D rendering context.
         * @param {Object} dataPoint - The data point for the hovered candle.
         * @param {number} mouseX - The X-coordinate of the mouse.
         * @param {number} mouseY - The Y-coordinate of the mouse.
         * @param {Object} chartRect - The dimensions of the main chart area.
         */
        function drawTooltip(ctx, dataPoint, mouseX, mouseY, chartRect) {
            if (!dataPoint) return;

            const tooltipWidth = 180;
            const tooltipHeight = 100;
            const padding = 10;

            let x = mouseX + 15;
            let y = mouseY + 15;

            // Adjust tooltip position if it goes off screen
            if (x + tooltipWidth + padding > chartRect.x + chartRect.width) {
                x = mouseX - tooltipWidth - 15;
            }
            if (y + tooltipHeight + padding > chartRect.y + chartRect.height) {
                y = chartRect.y + chartRect.height - tooltipHeight - padding;
            }
            if (x < chartRect.x) x = chartRect.x;
            if (y < chartRect.y) y = chartRect.y;

            ctx.fillStyle = '#2a2a2a'; // Tooltip background
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;

            // Draw tooltip box
            ctx.beginPath();
            ctx.roundRect(x, y, tooltipWidth, tooltipHeight, 5); // Using roundRect for modern browsers
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset shadow

            ctx.fillStyle = '#e0e0e0'; // Tooltip text color
            ctx.font = '12px Arial';
            let textY = y + padding + 12;

            ctx.fillText(`Date: ${formatDate(dataPoint.date)}`, x + padding, textY);
            textY += 18;
            ctx.fillText(`O: ${formatPrice(dataPoint.open)} H: ${formatPrice(dataPoint.high)}`, x + padding, textY);
            textY += 18;
            ctx.fillText(`L: ${formatPrice(dataPoint.low)} C: ${formatPrice(dataPoint.close)}`, x + padding, textY);
            textY += 18;
            ctx.fillText(`Vol: ${formatVolume(dataPoint.volume)}`, x + padding, textY);
        }

        /**
         * Main function to render the entire chart.
         */
        function renderChart() {
            if (!ctx || !chartData.length) return;

            // Clear canvas
            ctx.clearRect(0, 0, chartWidth, chartHeight);

            // Calculate visible data range
            const visibleData = chartData.slice(visibleStartIndex, visibleEndIndex + 1);
            if (visibleData.length === 0) return;

            // Define chart areas
            const chartAreaWidth = chartWidth - margin.left - margin.right;
            const mainChartAreaHeight = (chartHeight - margin.top - margin.bottom) * mainChartHeightRatio;
            const volumeChartAreaHeight = (chartHeight - margin.top - margin.bottom) * (1 - mainChartHeightRatio);

            mainChartRect = {
                x: margin.left,
                y: margin.top,
                width: chartAreaWidth,
                height: mainChartAreaHeight
            };
            volumeChartRect = {
                x: margin.left,
                y: margin.top + mainChartAreaHeight + 20, // 20px gap between charts
                width: chartAreaWidth,
                height: volumeChartAreaHeight - 20 // Adjust height for gap
            };

            // Calculate min/max prices and volumes for the visible range
            const ohlcMinMax = getMinMaxOHLC(chartData, visibleStartIndex, visibleEndIndex);
            minPrice = ohlcMinMax.min;
            maxPrice = ohlcMinMax.max;
            priceRange = maxPrice - minPrice;
            if (priceRange === 0) priceRange = 1; // Avoid division by zero

            const volumeMinMax = getMinMax(chartData, 'volume', visibleStartIndex, visibleEndIndex);
            minVolume = 0; // Volume always starts from 0
            maxVolume = volumeMinMax.max;
            volumeRange = maxVolume - minVolume;
            if (volumeRange === 0) volumeRange = 1; // Avoid division by zero

            // Calculate scales
            priceScaleY = mainChartRect.height / priceRange;
            volumeScaleY = volumeChartRect.height / volumeRange;
            candleSpacing = chartAreaWidth / visibleData.length;
            candleWidth = Math.max(1, candleSpacing * 0.7); // 70% of spacing, min 1px

            // --- Draw Grid ---
            drawGrid(ctx, mainChartRect, volumeChartRect, minPrice, maxPrice, minVolume, maxVolume);

            // --- Draw Candlesticks and Volume Bars ---
            for (let i = 0; i < visibleData.length; i++) {
                const dataPoint = visibleData[i];
                const x = mainChartRect.x + i * candleSpacing + candleSpacing / 2;

                // Candlestick
                drawCandlestick(
                    ctx, x,
                    dataPoint.open, dataPoint.high, dataPoint.low, dataPoint.close,
                    candleWidth, priceScaleY, mainChartRect.y, maxPrice
                );

                // Volume Bar
                const isBullish = dataPoint.close >= dataPoint.open;
                drawVolumeBar(
                    ctx, x,
                    dataPoint.volume,
                    candleWidth, volumeScaleY, volumeChartRect.y + volumeChartRect.height, // Volume bars draw from bottom up
                    isBullish
                );
            }

            // --- Draw Moving Averages ---
            drawSMA(ctx, chartData, 'sma7', '#ffeb3b', candleSpacing, priceScaleY, mainChartRect.x, mainChartRect.y, maxPrice); // Yellow
            drawSMA(ctx, chartData, 'sma21', '#2196f3', candleSpacing, priceScaleY, mainChartRect.x, mainChartRect.y, maxPrice); // Blue

            // --- Draw Axes ---
            drawAxes(ctx, minPrice, maxPrice, minVolume, maxVolume, mainChartRect, volumeChartRect, candleSpacing, visibleData);

            // --- Draw Tooltip if visible ---
            if (tooltip.visible && tooltip.data) {
                drawTooltip(ctx, tooltip.data, tooltip.x, tooltip.y, mainChartRect);
            }
        }

        // --- Event Handlers for Interactivity ---

        /**
         * Initializes the chart: gets canvas, processes data, sets up event listeners.
         */
        function initChart() {
            canvas = document.getElementById('candlestickChart');
            ctx = canvas.getContext('2d');

            processData();
            resizeCanvas(); // Set initial size and render

            window.addEventListener('resize', resizeCanvas);
            canvas.addEventListener('wheel', handleWheel);
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseout', handleMouseOut);
        }

        /**
         * Resizes the canvas to fit its container and re-renders the chart.
         */
        function resizeCanvas() {
            const container = document.getElementById('chart-container');
            chartWidth = container.clientWidth;
            chartHeight = container.clientHeight;

            // Set canvas dimensions
            canvas.width = chartWidth;
            canvas.height = chartHeight;

            // Adjust visible range to fit if needed (e.g., if chartWidth shrinks too much)
            const minCandleWidth = 5; // Minimum pixel width for a candle
            const maxVisibleCandles = Math.floor((chartWidth - margin.left - margin.right) / minCandleWidth);
            const currentVisibleCount = visibleEndIndex - visibleStartIndex + 1;

            if (currentVisibleCount > maxVisibleCandles) {
                visibleEndIndex = visibleStartIndex + maxVisibleCandles - 1;
                if (visibleEndIndex >= chartData.length) {
                    visibleEndIndex = chartData.length - 1;
                    visibleStartIndex = Math.max(0, visibleEndIndex - maxVisibleCandles + 1);
                }
            }
            
            renderChart();
        }

        /**
         * Handles mouse wheel events for zooming in/out.
         * @param {WheelEvent} e - The wheel event object.
         */
        function handleWheel(e) {
            e.preventDefault(); // Prevent page scroll

            const zoomFactor = 1.1; // Zoom in/out factor
            const mouseX = e.clientX - canvas.getBoundingClientRect().left;

            // Calculate the index of the candle under the mouse
            const chartAreaWidth = chartWidth - margin.left - margin.right;
            const dataIndexAtMouse = visibleStartIndex + Math.floor((mouseX - mainChartRect.x) / candleSpacing);

            let newVisibleCount;
            if (e.deltaY < 0) { // Zoom in
                newVisibleCount = Math.max(10, Math.floor((visibleEndIndex - visibleStartIndex + 1) / zoomFactor));
            } else { // Zoom out
                newVisibleCount = Math.min(chartData.length, Math.ceil((visibleEndIndex - visibleStartIndex + 1) * zoomFactor));
            }

            // Adjust visible range while trying to keep the mouse-over point centered
            let newStartIndex = dataIndexAtMouse - Math.floor((mouseX - mainChartRect.x) / chartAreaWidth * newVisibleCount);
            let newEndIndex = newStartIndex + newVisibleCount - 1;

            // Clamp to valid data range
            if (newStartIndex < 0) {
                newStartIndex = 0;
                newEndIndex = newVisibleCount - 1;
            }
            if (newEndIndex >= chartData.length) {
                newEndIndex = chartData.length - 1;
                newStartIndex = Math.max(0, newEndIndex - newVisibleCount + 1);
            }

            visibleStartIndex = newStartIndex;
            visibleEndIndex = newEndIndex;

            renderChart();
        }

        /**
         * Handles mouse down event for starting pan.
         * @param {MouseEvent} e - The mouse event object.
         */
        function handleMouseDown(e) {
            if (e.button === 0) { // Left click
                isDragging = true;
                lastMouseX = e.clientX;
                canvas.style.cursor = 'grabbing';
            }
        }

        /**
         * Handles mouse move event for panning and tooltip display.
         * @param {MouseEvent} e - The mouse event object.
         */
        function handleMouseMove(e) {
            const mouseX = e.clientX - canvas.getBoundingClientRect().left;
            const mouseY = e.clientY - canvas.getBoundingClientRect().top;

            // Pan logic
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const candlesShift = Math.round(-deltaX / candleSpacing); // How many candles to shift

                if (candlesShift !== 0) {
                    let newStartIndex = visibleStartIndex + candlesShift;
                    let newEndIndex = visibleEndIndex + candlesShift;

                    // Clamp to data range
                    if (newStartIndex < 0) {
                        newStartIndex = 0;
                        newEndIndex = (visibleEndIndex - visibleStartIndex) + newStartIndex;
                    }
                    if (newEndIndex >= chartData.length) {
                        newEndIndex = chartData.length - 1;
                        newStartIndex = newEndIndex - (visibleEndIndex - visibleStartIndex);
                    }

                    if (visibleStartIndex !== newStartIndex || visibleEndIndex !== newEndIndex) {
                        visibleStartIndex = newStartIndex;
                        visibleEndIndex = newEndIndex;
                        renderChart();
                    }
                }
                lastMouseX = e.clientX;
            }

            // Tooltip logic
            if (mainChartRect && mouseX >= mainChartRect.x && mouseX <= mainChartRect.x + mainChartRect.width &&
                mouseY >= mainChartRect.y && mouseY <= mainChartRect.y + mainChartRect.height) {

                const dataIndex = visibleStartIndex + Math.floor((mouseX - mainChartRect.x) / candleSpacing);
                if (dataIndex >= visibleStartIndex && dataIndex <= visibleEndIndex && chartData[dataIndex]) {
                    if (!tooltip.visible || tooltip.data !== chartData[dataIndex]) {
                        tooltip.visible = true;
                        tooltip.data = chartData[dataIndex];
                        tooltip.x = mouseX;
                        tooltip.y = mouseY;
                        renderChart(); // Re-render to show/update tooltip
                    }
                } else {
                    if (tooltip.visible) {
                        tooltip.visible = false;
                        renderChart(); // Re-render to hide tooltip
                    }
                }
            } else {
                if (tooltip.visible) {
                    tooltip.visible = false;
                    renderChart(); // Re-render to hide tooltip
                }
            }
        }

        /**
         * Handles mouse up event for ending pan.
         */
        function handleMouseUp() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }

        /**
         * Handles mouse out event for resetting pan and hiding tooltip.
         */
        function handleMouseOut() {
            isDragging = false;
            canvas.style.cursor = 'default';
            if (tooltip.visible) {
                tooltip.visible = false;
                renderChart(); // Re-render to hide tooltip
            }
        }

        // Initialize the chart when the DOM is ready
        document.addEventListener('DOMContentLoaded', initChart);
    </script>
</body>
