<div class="macro-widget" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e0e6f0;font-size:13px">
  <div style="margin-bottom:12px">
    <div style="font-size:11px;color:#6b7a8f;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">Indicadores Macroeconómicos</div>
    <div id="macro-timestamp" style="font-size:10px;color:#4a5a6f"></div>
  </div>

  <div id="macro-bands" style="display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:#1e2a45 transparent">
    <!-- Bandas se renderizan dinámicamente -->
  </div>

  <div id="macro-diagnosis" style="margin-top:8px;padding:10px 12px;background:#0a1220;border-radius:8px;font-size:11px;line-height:1.5;color:#8b9bb5;border-left:3px solid #1e2a45"></div>

  <div id="macro-loading" style="text-align:center;padding:30px;color:#4a5a6f;font-size:12px">
    <div style="font-size:24px;margin-bottom:6px">📊</div>
    Cargando indicadores...
  </div>
  <div id="macro-error" style="display:none;text-align:center;padding:30px;color:#ff5252;font-size:12px">
    <div style="font-size:24px;margin-bottom:6px">⚠️</div>
    <div id="macro-error-msg">Error al cargar datos</div>
  </div>
</div>

<script>
(function(){
  const root = document.currentScript.parentElement;
  const bandsEl = root.querySelector('#macro-bands');
  const diagEl = root.querySelector('#macro-diagnosis');
  const tsEl = root.querySelector('#macro-timestamp');
  const loadingEl = root.querySelector('#macro-loading');
  const errorEl = root.querySelector('#macro-error');
  const errorMsgEl = root.querySelector('#macro-error-msg');

  const COLORS = { green:'#00e676', yellow:'#ffc107', red:'#ff5252', gray:'#3a4a5f' };
  const LABELS = { green:'Bajo', yellow:'Moderado', red:'Alto', gray:'N/A' };

  const BANDS = [
    { id:'riesgo', name:'⚠️ Riesgo', icon:'🛡️' },
    { id:'ciclo',  name:'🔄 Ciclo',  icon:'📈' },
    { id:'global', name:'🌍 Global',  icon:'🌐' }
  ];

  function render(data) {
    const indicators = data.indicators || [];
    const diagnosis = data.diagnosis || 'Sin diagnóstico disponible';
    const timestamp = data.timestamp || '';

    loadingEl.style.display = 'none';
    errorEl.style.display = 'none';
    bandsEl.style.display = '';
    diagEl.style.display = '';

    // Timestamp
    if (timestamp) {
      try {
        const d = new Date(timestamp.replace(' ','T'));
        tsEl.textContent = 'Actualizado: ' + d.toLocaleString('es-ES', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
      } catch(e) {
        tsEl.textContent = 'Actualizado: ' + timestamp;
      }
    }

    // Build bands
    let html = '';
    BANDS.forEach(function(band) {
      const bandIndicators = indicators.filter(function(ind) { return ind.band === band.id; });
      if (!bandIndicators.length) return;

      html += '<div style="flex:0 0 auto;min-width:220px;max-width:260px;background:#0d1525;border-radius:10px;padding:10px;border:1px solid #1a2640">';
      html += '<div style="font-size:11px;font-weight:600;color:#8b9bb5;margin-bottom:8px">' + band.name + '</div>';

      bandIndicators.forEach(function(ind) {
        const color = COLORS[ind.level] || COLORS.gray;
        const label = LABELS[ind.level] || 'N/A';
        const isUp = ind.change && ind.change !== '—' && !ind.change.startsWith('-');
        const changeColor = ind.change === '—' ? '#4a5a6f' : isUp ? '#00e676' : '#ff5252';

        html += '<div style="display:flex;align-items:center;padding:7px 8px;margin-bottom:5px;background:#091020;border-radius:7px;gap:8px">';
        // Semaforo
        html += '<div style="width:10px;height:10px;border-radius:50%;background:' + color + ';flex-shrink:0;box-shadow:0 0 4px ' + color + '40"></div>';
        // Info
        html += '<div style="flex:1;min-width:0">';
        html += '<div style="font-size:11px;color:#6b7a8f">' + ind.name + '</div>';
        html += '<div style="display:flex;align-items:baseline;gap:6px">';
        html += '<span style="font-size:15px;font-weight:700;color:#e0e6f0">' + ind.value + '</span>';
        html += '<span style="font-size:10px;color:' + changeColor + ';font-weight:500">' + ind.change + '</span>';
        html += '</div></div>';
        // Level tag
        html += '<span style="font-size:9px;padding:2px 6px;border-radius:4px;background:' + color + '20;color:' + color + ';font-weight:500;flex-shrink:0">' + label + '</span>';
        html += '</div>';
      });

      html += '</div>';
    });

    bandsEl.innerHTML = html;

    // Diagnosis
    diagEl.innerHTML = '📋 ' + diagnosis;
  }

  function showError(msg) {
    loadingEl.style.display = 'none';
    bandsEl.style.display = 'none';
    diagEl.style.display = 'none';
    errorEl.style.display = '';
    errorMsgEl.textContent = msg || 'Error al cargar datos';
  }

  function fetchData() {
    fetch('/api/widgets/macro/data')
      .then(function(r) { return r.json(); })
      .then(function(response) {
        if (response.data && response.data.indicators) {
          render(response.data);
        } else if (response.error) {
          showError(response.error);
        } else {
          showError('Formato de respuesta inesperado');
        }
      })
      .catch(function(err) {
        showError('Error de conexión: ' + err.message);
      });
  }

  // Initial load
  fetchData();

  // Auto-refresh cada 60s
  setInterval(fetchData, 60000);
})();
</script>
